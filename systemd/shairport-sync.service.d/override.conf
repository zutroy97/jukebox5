; Drop-in for the vendor-packaged /usr/lib/systemd/system/shairport-sync.service
; (installed by the shairport-sync package, not this repo -- don't edit that
; file directly, a package upgrade would silently discard it). Install this
; alongside it instead: /etc/systemd/system/shairport-sync.service.d/override.conf
;
; The vendor unit has no ordering against mosquitto at all, so on a cold boot
; shairport-sync can (and did, on jukebox0) try its one-shot MQTT connect
; before mosquitto's listening socket is up -- it does not retry after that
; first failure, so a lost race silently kills MQTT metadata publishing
; (song/artist/title/play state) for the rest of that boot, even though
; shairport-sync's actual AirPlay audio relaying keeps working fine, so
; nothing about it *looks* broken locally.
[Unit]
After=mosquitto.service
; Wants=, not Requires= -- shairport-sync should still start and relay audio
; even if mosquitto is unavailable for some reason; it just won't have MQTT
; metadata that run, matching how the rest of this project degrades
; gracefully rather than hard-failing on a missing dependency.
Wants=mosquitto.service
