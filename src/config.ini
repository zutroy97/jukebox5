[display]
# Comma-separated list of song fields to cycle through on the animated
# displays, in display order. Valid values: artist, title, album.
fields=title,artist,album

[display8Animation1]
name=Scroll in from right

# Delay in seconds between writing each character during the animation.
delay_between_characters_s=0.01

# Delay in seconds to wait after finishing animating the entire text before restarting the animation. Only applies if the text exceeds the display width and needs to be animated in multiple lines.
delay_after_animation_finished_s=2

# Delay in seconds per segment when character_reveal_animation is
# "segment". Ignored when it's "immediate".
delay_between_segments_s=0.02

# How each character renders once it's its turn: "segment" reveals it one
# segment at a time (SegmentByCharacterRevealAnimator), "immediate" writes
# the whole character at once. Defaults to "segment" if omitted.
character_reveal_animation=segment

[display12Animation1]
name=Value display (artist/title/album text)

# See [display8Animation1] above for what each key means.
character_reveal_animation=segment

# 50% slower than the 0.02s default. Ignored while character_reveal_animation is "immediate".
delay_between_segments_s=0.03

[jukeboxPanelBinary]
name=Raspberry Pi GPIO Linux Binary Driver
device=/dev/jukebox_panel_bin

# Seconds per segment for the digit-reveal animation on settled display
# changes (see JukeboxPanelLinuxBinaryModule). Live keypad echo and the
# blink/error feedback sequence bypass this and stay instant regardless.
reveal_tick_s=0.1

[jukeboxPanel]
option=jukeboxPanelBinary

[trackSelectionFeedback]
# Feedback shown on the 4-digit display right after a 3-digit keypad
# selection completes, before it reverts to the current-track display.

# How many times the entered code blinks when the selection is valid
# (currently: matches a playlist track).
blink_count=3

# Seconds per on/off phase of that blink.
blink_phase_s=0.25

# Text shown (blank-padded to 4 characters) when the selection is invalid.
error_text=Err

# Seconds the error text is held before reverting.
error_duration_s=2.0

[playbackPauseFlash]
# While playback is paused, the 4-digit display flashes the track number
# on and off instead of showing it steadily. Seconds per on/off phase.
flash_interval_s=0.75

[mqtt]
broker_host=jukebox4
broker_port=1883
base_topic=shairport-sync
# Seconds to wait for the broker to acknowledge (PUBACK) a remote-control
# command (playpause/nextitem/previtem/queue_next) before treating shairport-
# sync's MQTT remote-control path as unresponsive and, if [sshWorker] is
# configured, falling back to its AirPlay-recovery script.
remote_command_timeout_s=5.0

# SSH link to the machine running the macOS "Music" app, used to run
# src/osx/scripts/recover_airplay_playback.js there when shairport-sync's own MQTT
# remote-control path stops responding. Section is optional -- omit it
# entirely to disable the feature. Authentication is always via SSH key
# (key_path); password auth is not supported.
[sshWorker]
host=mbp2017
username=simonbs
key_path=/home/simonbs/.ssh/id_rsa
port=22

# Seconds between SSH keepalive packets (also how quickly a dead connection
# is noticed).
# keepalive_interval_s=30

# Seconds to wait between reconnect attempts after the connection drops.
# reconnect_delay_s=5

# Seconds to wait for the initial TCP+SSH handshake before giving up on a
# connection attempt.
# connect_timeout_s=10

# If true, the remote host's key must already be in the known_hosts file
# (connection fails otherwise); if false, an unknown host key is trusted
# and added automatically on first connect.
# strict_host_key_checking=false

# The two settings below are used by the AirPlay-recovery script
# (src/osx/scripts/recover_airplay_playback.js, run over this SSH link as
# JavaScript for Automation) and are independent of each other -- don't
# assume they're the same value.

# Name of the AirPlay device to select. Defaults to this Pi's own hostname
# (via Python's socket.gethostname()) if omitted, since that's what
# shairport-sync advertises itself as over AirPlay unless configured
# otherwise.
airplay_device_name=Jukebox4

# Name of the Music.app playlist to start playing if nothing is already
# playing.
# playlist_name=Jukebox

# How many times to attempt the AirPlay-recovery script before giving up,
# and how long to wait between attempts. A "connecting to mac" status
# message is shown on the alpha display for each attempt; if every attempt
# fails, a persistent error message is shown there instead (until the next
# successful recovery, or until playback is otherwise seen to resume).
# recovery_attempts=3
# recovery_retry_delay_s=5
